name: CI — Tests & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Solidity: Compile & Test ──
  contracts:
    name: Compile & Test Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Compile Solidity contracts
        run: npx hardhat compile

      - name: Run contract tests
        run: npx hardhat test

  # ── Jest: React Native + Utility Unit Tests ──
  jest:
    name: Jest Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test

  # ── Backend: Smoke Test ──
  backend:
    name: Backend Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Verify backend starts
        working-directory: backend
        run: |
          timeout 10 node src/index.js &
          SERVER_PID=$!
          sleep 3
          # Health check
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/v1/health || echo "000")
          kill $SERVER_PID 2>/dev/null || true
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Backend health check passed (HTTP $HTTP_STATUS)"
          else
            echo "❌ Backend health check failed (HTTP $HTTP_STATUS)"
            exit 1
          fi

  # ── Lint ──
  lint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint || true
