name: Build TapPay APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Contracts: Compile & Test (fast gate) ──
  contracts:
    name: Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Compile Solidity contracts
        run: npx hardhat compile

      - name: Run Hardhat tests
        run: npx hardhat test

  # ── Jest: Unit Tests (fast gate) ──
  jest:
    name: Jest Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test

  # ── Android: Build APK (depends on all tests passing) ──
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: [contracts, jest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android Licenses & Install NDK
        run: |
          if command -v sdkmanager > /dev/null; then
            yes | sdkmanager --licenses || true
            sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1" || true
          else
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" "cmake;3.22.1" || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install npm dependencies
        run: npm ci

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Run Android JVM tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --max-workers=2

      # Release builds are never signed with the debug key.
      # With the TAPPAY_KEYSTORE_BASE64 secret set (the real release key) the APK is a real release.
      # Without it (pull requests, forks) a throwaway key is generated so the build is still verified;
      # that APK must NOT be distributed.
      - name: Prepare release signing key
        id: signing
        env:
          TAPPAY_KEYSTORE_BASE64: ${{ secrets.TAPPAY_KEYSTORE_BASE64 }}
          TAPPAY_KEYSTORE_PASSWORD_SECRET: ${{ secrets.TAPPAY_KEYSTORE_PASSWORD }}
          TAPPAY_KEY_ALIAS_SECRET: ${{ secrets.TAPPAY_KEY_ALIAS }}
          TAPPAY_KEY_PASSWORD_SECRET: ${{ secrets.TAPPAY_KEY_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/release.jks"
          if [ -n "$TAPPAY_KEYSTORE_BASE64" ]; then
            echo "$TAPPAY_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            STORE_PASS="$TAPPAY_KEYSTORE_PASSWORD_SECRET"
            KEY_ALIAS="$TAPPAY_KEY_ALIAS_SECRET"
            KEY_PASS="$TAPPAY_KEY_PASSWORD_SECRET"
            echo "kind=release" >> "$GITHUB_OUTPUT"
          else
            STORE_PASS="$(openssl rand -hex 16)"
            KEY_ALIAS="ci-throwaway"
            KEY_PASS="$STORE_PASS"
            keytool -genkeypair -keystore "$KEYSTORE" -storetype PKCS12 -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 2 \
              -dname "CN=TapPay CI throwaway"
            echo "kind=ci-throwaway" >> "$GITHUB_OUTPUT"
          fi
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          {
            echo "TAPPAY_KEYSTORE_FILE=$KEYSTORE"
            echo "TAPPAY_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "TAPPAY_KEY_ALIAS=$KEY_ALIAS"
            echo "TAPPAY_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build Release APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.1.12297006
          NODE_OPTIONS: --max_old_space_size=4096
        run: ./gradlew assembleRelease --no-daemon --stacktrace --max-workers=2

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.kind == 'release' && 'tappay-release-apk' || 'tappay-ci-apk-NOT-FOR-DISTRIBUTION' }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
