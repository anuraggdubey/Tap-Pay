apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * React Native Android configuration block
 */
react {
    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * Release signing inputs (all required, see docs/RELEASE_SIGNING.md):
 * TAPPAY_KEYSTORE_FILE, TAPPAY_KEYSTORE_PASSWORD, TAPPAY_KEY_ALIAS, TAPPAY_KEY_PASSWORD
 */
def releaseSigningConfigured = ["TAPPAY_KEYSTORE_FILE", "TAPPAY_KEYSTORE_PASSWORD", "TAPPAY_KEY_ALIAS", "TAPPAY_KEY_PASSWORD"].every {
    !(System.getenv(it) ?: "").trim().isEmpty()
}

/**
 * -PtappayUnsignedRelease builds an UNSIGNED release APK (app-release-unsigned.apk). CI uses it so
 * the release key never reaches a job that runs npm or Gradle code: a separate job signs the APK
 * with apksigner (see .github/workflows/build.yml and docs/RELEASE_SIGNING.md). Never debug-signed.
 */
def unsignedRelease = project.hasProperty("tappayUnsignedRelease")

/**
 * Build-time app configuration (#27): the Supabase URL and anon key are not committed. Metro inlines
 * them from the environment or the repo's .env (scripts/babel-inline-app-config.js), so a release
 * build must not start without them.
 */
def appEnvFile = rootProject.file("../.env")
def appConfigValue = { String name ->
    def fromEnv = System.getenv(name)?.trim()
    if (fromEnv) {
        return fromEnv
    }
    if (!appEnvFile.exists()) {
        return null
    }
    for (String raw : appEnvFile.readLines()) {
        def line = raw.trim()
        if (line.startsWith("export ")) {
            line = line.substring(7).trim()
        }
        def eq = line.indexOf('=')
        if (eq < 0 || line.substring(0, eq).trim() != name) {
            continue
        }
        def value = line.substring(eq + 1).trim()
        if (value.length() >= 2 && ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'")))) {
            value = value.substring(1, value.length() - 1)
        }
        return value ?: null
    }
    return null
}
def appConfigMissing = ["TAPPAY_SUPABASE_URL", "TAPPAY_SUPABASE_ANON_KEY"].findAll { !appConfigValue(it) }

gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { it.name ==~ /^(assemble|bundle|package|install)Release.*/ }
    if (wantsRelease && !releaseSigningConfigured && !unsignedRelease) {
        throw new GradleException(
            "Release builds must be signed with the TapPay release key. Set TAPPAY_KEYSTORE_FILE, " +
            "TAPPAY_KEYSTORE_PASSWORD, TAPPAY_KEY_ALIAS and TAPPAY_KEY_PASSWORD (see docs/RELEASE_SIGNING.md). " +
            "Release builds are never signed with the debug key.")
    }
    if (wantsRelease && !appConfigMissing.isEmpty()) {
        throw new GradleException(
            "Release builds need the Supabase config at build time. Missing: ${appConfigMissing.join(', ')}. " +
            "Set them in the environment or in the repo's .env file (see .env.example).")
    }
}

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.tappay"
    defaultConfig {
        applicationId "com.tappay"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        // Debug builds only. This keystore is public (committed) and must never sign a release.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Release signing comes only from the environment. There is no fallback to the debug key.
        release {
            if (releaseSigningConfigured) {
                storeFile file(System.getenv("TAPPAY_KEYSTORE_FILE"))
                storePassword System.getenv("TAPPAY_KEYSTORE_PASSWORD")
                keyAlias System.getenv("TAPPAY_KEY_ALIAS")
                keyPassword System.getenv("TAPPAY_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig unsignedRelease ? null : signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    lint {
        checkReleaseBuilds true
        abortOnError true
    }
}

dependencies {
    testImplementation("junit:junit:4.13.2")
    testImplementation("org.robolectric:robolectric:4.14.1")

    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7")

    def isHermesEnabled = project.hasProperty("hermesEnabled") ? project.hermesEnabled.toBoolean() : true
    if (isHermesEnabled) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
