buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 24
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.10"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.10")
    }
    configurations.classpath {
        resolutionStrategy {
            force("com.android.tools.build:gradle:8.7.3")
            force("org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.10")
        }
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy {
            force("androidx.core:core:1.13.1")
            force("androidx.core:core-ktx:1.13.1")
            force("androidx.transition:transition:1.5.0")
            force("androidx.transition:transition-ktx:1.5.0")
        }
    }
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            freeCompilerArgs += ["-Xskip-metadata-version-check"]
        }
    }
}

subprojects { subproject ->
    configurations.all {
        resolutionStrategy {
            force("androidx.core:core:1.13.1")
            force("androidx.core:core-ktx:1.13.1")
            force("androidx.transition:transition:1.5.0")
            force("androidx.transition:transition-ktx:1.5.0")
        }
    }
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            freeCompilerArgs += ["-Xskip-metadata-version-check"]
        }
    }
    if (subproject.name == "react-native-safe-area-context") {
        subproject.pluginManager.apply("com.facebook.react")
        subproject.afterEvaluate {
            def isNewArch = rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
            subproject.android.sourceSets.main.java.srcDirs += ["src/main/java", isNewArch ? "src/fabric/java" : "src/paper/java"]
            subproject.android.buildFeatures.buildConfig = true
            subproject.android.defaultConfig.buildConfigField("boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArch.toString())
        }
    }
}
