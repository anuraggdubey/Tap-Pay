name: Build TapPay APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Contracts: Compile & Test (fast, runs first) ──
  contracts:
    name: Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Compile Solidity contracts
        run: npx hardhat compile

      - name: Run Hardhat tests
        run: npx hardhat test

  # ── Android: Build Debug APK (depends on contract tests passing) ──
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK, NDK, and Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;27.1.12297006" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install npm dependencies
        run: npm ci

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tappay-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

